---
# Project Juicy Godot - Learned Instincts
# Generated from git history analysis on 2026-02-05
# Analyzed 200 commits

instincts:
  # ==================== Commit Conventions ====================

  - id: godot-conventional-commits
    trigger: when writing a commit message
    confidence: 0.95
    domain: git
    source: local-repo-analysis
    evidence_count: 200
    pattern: |
      Use Conventional Commits with Chinese descriptions:

      Format: <type>[: <scope>] <description>

      Types:
      - feat: - New features
      - fix: - Bug fixes
      - refactor: - Code refactoring
      - docs: - Documentation updates
      - test: - Testing and test updates
      - debug: - Debugging sessions

      Common scopes:
      - timeline, runtime-instance, i18n
      - Specific event names: mouse-enter, mouse-exit, etc.
      - System components: action_runner, trigger, etc.

      Examples from repo:
      - feat: 完成 JuicyTimelineDriver 状态隔离迁移
      - fix(timeline): pass state parameter to _initialize_track_states
      - refactor(timeline): complete state migration for public interfaces
      - docs: 添加 JuicyMixer Driver 状态污染修复完成报告

  - id: godot-incremental-refactoring
    trigger: when planning a large refactoring
    confidence: 0.90
    domain: development-workflow
    source: local-repo-analysis
    evidence_count: 8
    pattern: |
      Break large refactors into small, focused commits:

      1. Add new structure/class
      2. Migrate one method/area at a time
      3. Test after each migration
      4. Complete public interface migration
      5. Finalize and remove old code

      Example from JuicyTimelineDriver state migration:
      - refactor(timeline): add TimelineState inner class
      - refactor(timeline): use TimelineState in prepare()
      - refactor(timeline): use TimelineState in process()
      - refactor(timeline): complete track processing migration
      - refactor(timeline): complete cleanup migration
      - refactor(timeline): complete public interface migration

  # ==================== File Organization ====================

  - id: godot-file-naming-conventions
    trigger: when creating new GDScript files
    confidence: 0.98
    domain: file-organization
    source: local-repo-analysis
    evidence_count: 150
    pattern: |
      File naming conventions for Bricks system:

      Events: on_<event_name>.gd
      - Examples: on_mouse_button.gd, on_area_2d_enter.gd, on_timer.gd

      Instructions: <action>_<target>.gd
      - Examples: tween_property.gd, set_property_value.gd, show_hide_ui.gd

      Conditions: check_<condition>.gd
      - Examples: check_is_playing.gd, check_distance.gd, check_on_floor.gd

      Tests: test_<feature>.gd
      - Examples: test_event_state_separation.gd

      Use snake_case for all file names.

  - id: godot-class-naming-conventions
    trigger: when creating class_name definitions
    confidence: 0.98
    domain: naming-conventions
    source: local-repo-analysis
    evidence_count: 150
    pattern: |
      Class naming conventions (PascalCase):

      Events: On<EventType>
      - Examples: OnMouseButton, OnArea2DEnter, OnTimer

      Instructions: <Action><Target>
      - Examples: TweenProperty, SetPropertyValue, ShowHideUI

      Conditions: Check<Condition>
      - Examples: CheckIsPlaying, CheckDistance, CheckOnFloor

      Utilities: <Name>Utils
      - Examples: BricksNodeUtils, SignalManager

  - id: godot-folder-structure
    trigger: when organizing code
    confidence: 0.95
    domain: architecture
    source: local-repo-analysis
    evidence_count: 50
    pattern: |
      Bricks system folder structure:

      addons/bricks/
      ├── core/base/          # Base classes (BaseEvent, BaseInstruction, etc.)
      ├── events/             # Event types (by category)
      │   ├── animation/
      │   ├── input/
      │   ├── physics/
      │   └── ...
      ├── instructions/       # Instruction types
      │   ├── flow_control/
      │   ├── node_operations/
      │   └── tween/
      ├── conditions/         # Condition types (by category)
      ├── utils/             # Utility functions
      ├── localization/      # translations.csv
      ├── tests/             # Test scenes
      └── docs/              # Documentation (system, user, development)

      Keep related functionality grouped together.
      Use many small files (200-400 lines) rather than few large files.

  # ==================== GDScript Coding Patterns ====================

  - id: godot-resource-based-architecture
    trigger: when creating Bricks components (Events, Instructions, Conditions)
    confidence: 0.95
    domain: architecture
    source: local-repo-analysis
    evidence_count: 100
    pattern: |
      Bricks components extend Resource, not Node:

      class_name MyEvent extends Resource

      @export var target_node: NodePath = NodePath("")
      @export var property_path: String = ""

      func execute(context: ExecutionContext) -> void:
          # Implementation here

      Key points:
      - Use @export for inspector-visible properties
      - Implement execute() method
      - Don't store Node references, use NodePath
      - Implement get_config_dict() / load_from_dict() for serialization

  - id: godot-runtimeinstance-pattern
    trigger: when creating Events that need state
    confidence: 0.90
    domain: architecture
    source: local-repo-analysis
    evidence_count: 40
    pattern: |
      Use RuntimeEventInstance for event-specific state:

      class_name MyEvent extends Resource

      ## Declare what state this event needs
      static func get_default_runtime_state() -> Dictionary:
          return {
              "previous_value": null,
              "cooldown_remaining": 0.0
          }

      ## Access state in event methods
      func _on_event_fired():
          var state = get_runtime_state()
          state["previous_value"] = current_value

      Why: Resources are shared; RuntimeInstance provides per-Trigger isolation.

  - id: godot-editor-thread-safety
    trigger: when writing code that runs in editor (Resource inspectors)
    confidence: 0.92
    domain: godot-api
    source: local-repo-analysis
    evidence_count: 20
    pattern: |
      CRITICAL: Some methods are NOT thread-safe in editor mode:

      ❌ WRONG - Causes errors:
      var material = node.get_material()
      var mats = node.get_active_materials()

      ✅ CORRECT - Use property access:
      var material = node.get("material")
      if material != null and material is Material:
          # Use material

      Methods to avoid in editor:
      - get_material()
      - get_surface_override_material()
      - get_active_materials()

      Safe alternative: Use get("property_name") for property access.

  - id: godot-node-path-resolution
    trigger: when resolving NodePath in Resources/Bricks components
    confidence: 0.88
    domain: godot-api
    source: local-repo-analysis
    evidence_count: 30
    pattern: |
      Use BricksNodeUtils for editor-compatible node resolution:

      ## In editor (Resource inspector)
      if Engine.is_editor_hint():
          var editor_interface = Engine.get_singleton("EditorInterface")
          var edited_root = editor_interface.get_edited_scene_root()
          var node = BricksNodeUtils.find_node_from_resource_context(
              edited_root, self, target_node
          )

      ## At runtime (during execution)
      func execute(context: ExecutionContext):
          var node = context.get_node(target_node)

      Special case: ".." path
      When Trigger stored as child node, ".." means resource owner, not parent.
      BricksNodeUtils handles this automatically.

  - id: godot-property-caching
    trigger: when implementing expensive property list generation
    confidence: 0.85
    domain: performance
    source: local-repo-analysis
    evidence_count: 5
    pattern: |
      Cache expensive property list calculations:

      var _cached_properties: Array[PropertyInfo] = []
      var _cached_node: Node = null

      func _get_properties():
          # Check cache
          if _cached_node == _target_node and not _cached_properties.is_empty():
              return _cached_properties

          # Compute
          var properties = _compute_properties()

          # Update cache
          _cached_properties = properties
          _cached_node = _target_node
          return properties

      # Invalidate cache when needed
      var target_node: NodePath = NodePath(""):
          set(value):
              target_node = value
              _cached_properties.clear()
              _cached_node = null

      Avoids repeated calculations when Inspector refreshes.

  - id: godot-dynamic-property-list
    trigger: when creating dynamic inspector properties
    confidence: 0.90
    domain: godot-api
    source: local-repo-analysis
    evidence_count: 25
    pattern: |
      Use _get_property_list() for dynamic inspector properties:

      func _get_property_list() -> Array[Dictionary]:
          var properties: Array[Dictionary] = []

          # Add category
          properties.append({
              name = "Category Name",
              type = TYPE_NIL,
              hint = PROPERTY_HINT_NONE,
              usage = PROPERTY_USAGE_CATEGORY
          })

          # Add dynamic enum
          properties.append({
              name = "property_name",
              type = TYPE_STRING,
              hint = PROPERTY_HINT_ENUM,
              hint_string = _get_enum_string(),  # Comma-separated values
              usage = PROPERTY_USAGE_DEFAULT | PROPERTY_USAGE_SCRIPT_VARIABLE
          })

          return properties

      Call notify_property_list_changed() when options change.

  - id: godot-signal-connections
    trigger: when connecting signals in Godot 4.x
    confidence: 0.98
    domain: godot-api
    source: local-repo-analysis
    evidence_count: 100
    pattern: |
      Use Callable syntax for signal connections (Godot 4.x):

      ✅ CORRECT:
      object.signal_name.connect(_on_signal_name)

      func _on_signal_name():
          # Handle signal

      ❌ WRONG (Godot 3.x style):
      object.connect("signal_name", self, "_on_signal_name")

  - id: godot-type-annotations
    trigger: when writing GDScript code
    confidence: 0.95
    domain: code-style
    source: local-repo-analysis
    evidence_count: 200
    pattern: |
      Always use explicit type annotations:

      ## Variables
      var value: float = 0.0
      var items: Array[Resource] = []
      var node: Node = null

      ## Function returns
      func get_value() -> Variant:
          pass

      func get_properties() -> Array[PropertyInfo]:
          pass

      ## Parameters
      func process(context: ExecutionContext, delta: float) -> void:
          pass

      Improves code clarity and catches type errors early.


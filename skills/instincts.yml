  # ==================== Common Pitfalls ====================

  - id: godot-no-gdignore-files
    trigger: when tempted to create .gdignore files
    confidence: 0.99
    domain: godot-workflow
    source: local-repo-analysis
    evidence_count: 5
    pattern: |
      NEVER create .gdignore files while actively working!

      Why: .gdignore causes Godot to ignore entire folders, making resources
           unavailable in the editor.

      .gdignore does NOT support:
      - Wildcards/patterns (unlike .gitignore)
      - Recursive ignores
      - Partial folder ignores

      Only use .gdignore when you absolutely need to hide a folder AND
      understand the consequences.

  - id: godot-tab-indentation
    trigger: when writing GDScript files
    confidence: 0.98
    domain: code-style
    source: local-repo-analysis
    evidence_count: 200
    pattern: |
      ALWAYS use TAB indentation in GDScript (Godot standard).

      Do NOT use spaces.
      Configure editor to convert tabs to tabs (not spaces).

  - id: godot-abstract-methods
    trigger: when defining abstract methods (Godot 4.5+)
    confidence: 0.90
    domain: godot-api
    source: local-repo-analysis
    evidence_count: 10
    pattern: |
      Use @abstract annotation for abstract methods (Godot 4.5+):

      @abstract
      func execute(context: ExecutionContext) -> void:
          pass

      This ensures subclasses must implement the method.

  # ==================== Editor Workflow ====================

  - id: godot-scene-loading-order
    trigger: when debugging Resource initialization issues
    confidence: 0.85
    domain: debugging
    source: local-repo-analysis
    evidence_count: 5
    pattern: |
      Scene loading order can cause issues in Resources:

      Problem: Godot loads Resources by setting properties in sequence.
               edited_root may be null when setters are called.

      Solution: Use lazy initialization in _get_property_list():

      func _get_property_list():
          # Retry getting node if instance is null
          if Engine.is_editor_hint() and _target_node_instance == null:
              _update_target_node_info()

      This ensures node resolution works when Inspector refreshes after scene loads.

  # ==================== Migration Patterns ====================

  - id: godot-component-migration-workflow
    trigger: when migrating multiple components to new architecture
    confidence: 0.88
    domain: development-workflow
    source: local-repo-analysis
    evidence_count: 15
    pattern: |
      When migrating multiple components (e.g., events to RuntimeInstance):

      1. Migrate one component at a time
      2. Test each migration individually
      3. Commit after each successful migration
      4. Document progress in plan files
      5. Create completion reports for batches

      Example commit sequence:
      - feat: 迁移 OnTimer 到 RuntimeInstance 架构
      - feat: 迁移 OnInterval 和 OnInputKey 到 RuntimeInstance 架构
      - feat: 迁移 OnArea2DEnter 和 OnArea3DEntered 到 RuntimeInstance 架构
      - feat: 迁移 OnSignalFromGroup 到 RuntimeInstance 架构
      - feat: 完成 OnMouseButton 和 OnCooldownFinished 的 RuntimeInstance 迁移

      Each commit should:
      - Only touch affected files
      - Include necessary tests
      - Be independently verifiable


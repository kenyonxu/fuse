id: godot-4.6-syntax
trigger: when writing GDScript
confidence: 0.90
domain: coding-style
source: local-repo-analysis
scope: project-juicy-godot
---

Use Godot 4.x / GDScript 2.0 syntax.

- Use @abstract for abstract classes/methods (Godot 4.5+)
- Use Callable for signal connections
- Use typed variables: var value: float = 0.0
- Use typed arrays: Array[Node]
- Avoid ? operator (not Godot syntax)
- Check Engine.is_editor_hint() to skip editor-only code

Evidence: Project targets Godot 4.6. BaseEvent and BaseInstruction use @abstract. Typed variables used throughout.

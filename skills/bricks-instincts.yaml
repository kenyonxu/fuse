id: bricks-event-structure
trigger: when creating a new Bricks event
confidence: 0.95
domain: architecture
source: local-repo-analysis
scope: project-juicy-godot
---

Follow BaseEvent inheritance pattern when creating a new Bricks event.

1. Extend BaseEvent
2. Use @icon decorator with builtin icon
3. Implement _update_resource_name()
4. Implement initialize(owner_node: Node)
5. Implement terminate(owner_node: Node)
6. Implement get_event_type() -> String
7. Implement get_event_category() -> String
8. Implement static _get_event_metadata() -> EventMetadata
9. Use _log_*_localized() for logging
10. Place in appropriate events/ subdirectory

Evidence: 9+ event types follow this pattern. Events organized by category (animation, audio, input, lifecycle, etc.). All events use localization keys for display.


id: bricks-localization
trigger: when adding user-facing text
confidence: 0.85
domain: i18n
source: local-repo-analysis
scope: project-juicy-godot
---

Use localization keys instead of hardcoded text in Bricks.

- Add translation key to addons/bricks/localization/translations.csv
- Use _log_*_localized() methods for logging
- Use _create_bricks_error_localized() for errors
- Set name_key, category_key, description_key in metadata

Evidence: All events use localization keys (BRICKS_EVENT_*_NAME, etc.). Dedicated i18n: commits for translation updates. BricksLocalization class for centralized translation.


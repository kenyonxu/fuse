id: bricks-commit-convention
trigger: when writing a commit message
confidence: 0.85
domain: git
source: local-repo-analysis
scope: project-juicy-godot
---

Use Conventional Commits for project-juicy-godot.

Prefix commits with one of:
- `feat:` - 新功能
- `fix:` - Bug 修复
- `refactor(category):` - 代码重构
- `docs:` - 文档更新
- `chore:` - 维护任务
- `i18n:` - 国际化

Evidence: Analyzed 200 commits, ~40% follow feat/fix/refactor format. Common categories: (bricks), (lifecycle), (input), (audio).


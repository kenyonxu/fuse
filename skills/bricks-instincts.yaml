id: bricks-test-pairing
trigger: when creating a new Bricks event or instruction
confidence: 0.80
domain: testing
source: local-repo-analysis
scope: project-juicy-godot
---

Create test files alongside implementation for Bricks.

When adding a new event or instruction:
1. Create test scene: addons/bricks/tests/[category]/test_[name].tscn
2. Create test script: addons/bricks/tests/[category]/test_[name].gd
3. Test script extends Node
4. Call test function from _ready()

Evidence: All events have corresponding test files. Tests organized by category matching events/ structure.


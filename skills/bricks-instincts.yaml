id: bricks-file-naming
trigger: when creating a new GDScript file
confidence: 0.90
domain: coding-style
source: local-repo-analysis
scope: project-juicy-godot
---

Use snake_case for files, PascalCase for classes in Godot/Bricks.

- File names: snake_case (e.g., on_enter_tree.gd, base_event.gd)
- Class names: PascalCase (e.g., class_name OnEnterTree)
- Private variables: underscore prefix (e.g., var _owner_node_ref)
- Use TAB indentation (Godot standard)

Evidence: 100% of codebase follows snake_case file naming. All classes use PascalCase. Consistent underscore prefix for private members.

